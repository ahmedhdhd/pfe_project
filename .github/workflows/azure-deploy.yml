name: Deploy to Azure

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  NODE_VERSION: "20"
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  BACKEND_APP: ${{ vars.AZURE_BACKEND_APP }}
  FRONTEND_APP: ${{ vars.AZURE_FRONTEND_APP }}
  ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  AI_APP: ${{ vars.AZURE_AI_APP }}

jobs:
  deploy-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push AI image
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image quetzlearn-ai:${{ github.sha }} \
            --image quetzlearn-ai:latest \
            --file ai-service/Dockerfile \
            ai-service

      - name: Update Container App
        run: |
          ACR_LOGIN=$(az acr show --name ${{ env.ACR_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query loginServer -o tsv)
          az containerapp update \
            --name ${{ env.AI_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image "${ACR_LOGIN}/quezlearn-ai:${{ github.sha }}"

  deploy-backend:
    runs-on: ubuntu-latest
    needs: deploy-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install and build backend
        working-directory: backend
        run: |
          npm ci
          npm run build
          npx prisma generate

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.BACKEND_APP }}
          package: backend

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Prepare standalone package
        working-directory: frontend
        run: |
          mkdir -p deploy_pkg
          cp package.json package-lock.json deploy_pkg/
          cp -r .next/standalone/* deploy_pkg/
          cp -r .next/static deploy_pkg/.next/static
          cp -r public deploy_pkg/public

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy frontend
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.FRONTEND_APP }}
          package: frontend/deploy_pkg

name: Deploy to Azure with Docker

on:
  push:
    branches: [skipaionboarding]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "20"
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  AZURE_BACKEND_APP: ${{ vars.AZURE_BACKEND_APP }}
  AZURE_FRONTEND_APP: ${{ vars.AZURE_FRONTEND_APP }}
  AZURE_AI_APP: ${{ vars.AZURE_AI_APP }}
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
  AI_SERVICE_URL: ${{ vars.AI_SERVICE_URL }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TESLABACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TESLABACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TESLABACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run database migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build and push backend image
        run: |
          az acr build \
            --registry "${{ env.AZURE_ACR_NAME }}" \
            --image "queztlearn-backend:${{ github.sha }}" \
            --image "queztlearn-backend:latest" \
            --file backend/Dockerfile \
            backend

      - name: Build and push frontend image
        run: |
          az acr build \
            --registry "${{ env.AZURE_ACR_NAME }}" \
            --image "queztlearn-frontend:${{ github.sha }}" \
            --image "queztlearn-frontend:latest" \
            --build-arg "NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}" \
            --file frontend/Dockerfile \
            frontend

      - name: Build and push AI image
        run: |
          az acr build \
            --registry "${{ env.AZURE_ACR_NAME }}" \
            --image "queztlearn-ai:${{ github.sha }}" \
            --image "queztlearn-ai:latest" \
            --file ai-service/Dockerfile \
            ai-service

      - name: Update backend Web App
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "${{ env.AZURE_ACR_NAME }}" --query loginServer -o tsv)
          az webapp config container set \
            --name "${{ env.AZURE_BACKEND_APP }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --docker-custom-image-name "${ACR_LOGIN_SERVER}/queztlearn-backend:${{ github.sha }}" \
            --docker-registry-server-url "https://${ACR_LOGIN_SERVER}"
          az webapp config appsettings set \
            --name "${{ env.AZURE_BACKEND_APP }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --settings AI_SERVICE_URL="${{ env.AI_SERVICE_URL }}"

      - name: Update frontend Web App
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "${{ env.AZURE_ACR_NAME }}" --query loginServer -o tsv)
          az webapp config container set \
            --name "${{ env.AZURE_FRONTEND_APP }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --docker-custom-image-name "${ACR_LOGIN_SERVER}/queztlearn-frontend:${{ github.sha }}" \
            --docker-registry-server-url "https://${ACR_LOGIN_SERVER}"
          az webapp config appsettings set \
            --name "${{ env.AZURE_FRONTEND_APP }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --settings NEXT_PUBLIC_API_URL="${{ env.NEXT_PUBLIC_API_URL }}"

      - name: Update AI Web App
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "${{ env.AZURE_ACR_NAME }}" --query loginServer -o tsv)
          az webapp config container set \
            --name "${{ env.AZURE_AI_APP }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --docker-custom-image-name "${ACR_LOGIN_SERVER}/queztlearn-ai:${{ github.sha }}" \
            --docker-registry-server-url "https://${ACR_LOGIN_SERVER}"

name: Deploy to Azure with Docker

on:
  push:
    branches: [skipaionboarding]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "20"
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  AZURE_BACKEND_APP: ${{ vars.AZURE_BACKEND_APP }}
  AZURE_FRONTEND_APP: ${{ vars.AZURE_FRONTEND_APP }}
  AZURE_AI_APP: ${{ vars.AZURE_AI_APP }}
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
  AI_SERVICE_URL: ${{ vars.AI_SERVICE_URL }}
  FRONTEND_URL: ${{ vars.FRONTEND_URL }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}



      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ env.AZURE_ACR_NAME }}
          az acr update -n ${{ env.AZURE_ACR_NAME }} --admin-enabled true

      - name: Build and push backend image
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "${{ env.AZURE_ACR_NAME }}" --query loginServer -o tsv)
          docker build -t "${ACR_LOGIN_SERVER}/queztlearn-backend:${{ github.sha }}" -t "${ACR_LOGIN_SERVER}/queztlearn-backend:latest" -f backend/Dockerfile backend
          docker push "${ACR_LOGIN_SERVER}/queztlearn-backend:${{ github.sha }}"
          docker push "${ACR_LOGIN_SERVER}/queztlearn-backend:latest"

      - name: Build and push frontend image
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "${{ env.AZURE_ACR_NAME }}" --query loginServer -o tsv)
          docker build --build-arg "NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}" -t "${ACR_LOGIN_SERVER}/queztlearn-frontend:${{ github.sha }}" -t "${ACR_LOGIN_SERVER}/queztlearn-frontend:latest" -f frontend/Dockerfile frontend
          docker push "${ACR_LOGIN_SERVER}/queztlearn-frontend:${{ github.sha }}"
          docker push "${ACR_LOGIN_SERVER}/queztlearn-frontend:latest"

      - name: Build and push AI image
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "${{ env.AZURE_ACR_NAME }}" --query loginServer -o tsv)
          docker build -t "${ACR_LOGIN_SERVER}/queztlearn-ai:${{ github.sha }}" -t "${ACR_LOGIN_SERVER}/queztlearn-ai:latest" -f ai-service/Dockerfile ai-service
          docker push "${ACR_LOGIN_SERVER}/queztlearn-ai:${{ github.sha }}"
          docker push "${ACR_LOGIN_SERVER}/queztlearn-ai:latest"

      - name: Update backend Web App
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "${{ env.AZURE_ACR_NAME }}" --query loginServer -o tsv)
          az webapp config container set \
            --name "${{ env.AZURE_BACKEND_APP }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --container-image-name "${ACR_LOGIN_SERVER}/queztlearn-backend:${{ github.sha }}" \
            --container-registry-url "https://${ACR_LOGIN_SERVER}"
          az webapp config appsettings set \
            --name "${{ env.AZURE_BACKEND_APP }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --settings \
              AI_SERVICE_URL="${{ vars.AI_SERVICE_URL }}" \
              AI_SERVICE_INTERNAL_TOKEN="${{ secrets.AI_SERVICE_INTERNAL_TOKEN }}" \
              FRONTEND_URL="${{ env.FRONTEND_URL }}"

      - name: Update frontend Web App
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "${{ env.AZURE_ACR_NAME }}" --query loginServer -o tsv)
          az webapp config container set \
            --name "${{ env.AZURE_FRONTEND_APP }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --container-image-name "${ACR_LOGIN_SERVER}/queztlearn-frontend:${{ github.sha }}" \
            --container-registry-url "https://${ACR_LOGIN_SERVER}"
          az webapp config appsettings set \
            --name "${{ env.AZURE_FRONTEND_APP }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --settings \
              NEXT_PUBLIC_API_URL="${{ env.NEXT_PUBLIC_API_URL }}" \
              BACKEND_API_URL="${{ env.NEXT_PUBLIC_API_URL }}"

      - name: Update AI Web App
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "${{ env.AZURE_ACR_NAME }}" --query loginServer -o tsv)
          az webapp config container set \
            --name "${{ env.AZURE_AI_APP }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --container-image-name "${ACR_LOGIN_SERVER}/queztlearn-ai:${{ github.sha }}" \
            --container-registry-url "https://${ACR_LOGIN_SERVER}"
          az webapp config appsettings set \
            --name "${{ env.AZURE_AI_APP }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --settings \
              PORT=8000 \
              AI_SERVICE_INTERNAL_TOKEN="${{ secrets.AI_SERVICE_INTERNAL_TOKEN }}" \
              DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              DIRECT_URL="${{ secrets.DIRECT_URL }}" \
              OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
              OPENROUTER_MODEL="deepseek/deepseek-chat-v3-0324" \
              OPENROUTER_EMBEDDING_MODEL="openai/text-embedding-3-large" \
              OPENROUTER_PLAYGROUND_MODEL="deepseek/deepseek-chat-v3-0324" \
              OPENROUTER_HTTP_REFERER="https://teslaacademy.dedyn.io" \
              OPENROUTER_APP_TITLE="TeslaAcademy LMS" \
              OPENROUTER_SUMMARY_MAX_TOKENS=1200 \
              OPENROUTER_ASSIGNMENT_FEEDBACK_MAX_TOKENS=1400 \
              OPENROUTER_ASSIGNMENT_GENERATION_MAX_TOKENS=2200 \
              GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}"
